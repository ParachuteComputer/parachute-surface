# Release workflow — triggered by a merge to `next` or `main` (port of
# hub#790 / #911 / #913), or by pushing a semver tag.
#
# This workflow publishes SIX npm packages on different tag namespaces,
# plus THREE GitHub-release tarballs (private:true — distribution is the
# release asset, not npm; those stay tag-triggered):
#
#   - @openparachute/surface        ← tag prefix `v...`           (from packages/surface-host)
#   - @openparachute/surface-client ← tag prefix `client-v...`    (from packages/surface-client)
#   - @openparachute/account-client ← tag prefix `account-v...`   (from packages/account-client)
#   - @openparachute/surface-render ← tag prefix `render-v...`    (from packages/surface-render)
#   - @openparachute/doc-schema     ← tag prefix `doc-schema-v...` (from packages/doc-schema)
#   - @openparachute/surface-server ← tag prefix `server-v...`    (from packages/surface-server)
#   - docs-editor release tarball   ← tag prefix `docs-editor-v...` (tag-only)
#   - meeting-ingest release tarball ← tag prefix `meeting-ingest-v...` (tag-only)
#   - meeting-mcp release tarball   ← tag prefix `meeting-mcp-v...` (tag-only)
#
# All npm packages have npm Trusted Publisher rules pointing at this workflow
# file. On a tag push the jobs below gate on the tag prefix so only one package
# publishes; on a merge each job gates on its own `plan` output, so a merge can
# publish several packages at once. Independent release cadences either way.
#
# Tag prefixes are ALIASES, not directory basenames (`packages/surface-host`
# ships as `v…`, not `surface-host-v…`). `scripts/release-plan.ts` maps them
# explicitly — inferring the basename re-creates hub#830.
#
# Tag conventions (matches governance rule 2):
#   - rc:     v<X>.<Y>.<Z>-rc.<N>          (e.g. v0.3.9-rc.1, client-v0.3.7-rc.1)
#   - stable: v<X>.<Y>.<Z>                 (e.g. v0.3.9)
#
# Release flow (publish-on-merge — the tag path still works, see `plan`):
#   1. Cutting an rc: open a release PR bumping `version` to an `-rc.N`
#      shape, targeting `next` directly. Promoting to stable: same shape,
#      but the PR targets `main` and drops the `-rc.N` suffix; `plan`
#      refuses it unless npm already has that core as an rc AND the diff
#      from that rc tag is version/changelog/lockfile only, AND the trigger
#      is a branch push of `main`.
#   2. Merge it. That IS the release signal — `plan` compares each
#      package.json against npm and publishes what's new.
#   3. CI runs tests once, then publishes whichever packages `plan` selected.
#   4. `tag-record` pushes the matching tag afterwards as a RECORD.
#      Nothing needs to be tagged by hand for npm packages.
#   Tarball packages (docs-editor / meeting-ingest / meeting-mcp) still
#   ship by pushing their tag; they are not on npm.
#
# Operator setup (one-time) — see RELEASING.md:
#   - npm Trusted Publisher rules: one per package (surface, surface-client,
#     account-client, surface-render, doc-schema, surface-server).
#     All six rules point at: org=ParachuteComputer, repo=parachute-surface,
#     workflow=release.yml, env blank.
#   - No NPM_TOKEN secret needed; OIDC.

name: Release

on:
  push:
    # Publish-on-merge. See the `plan` job. `next` publishes rc's directly.
    # `decidePublish` is idempotent on an already-published version, refuses
    # to move a dist-tag backwards, refuses a `latest` publish unless npm
    # already has a matching `-rc.*` and the diff is a pure suffix-drop,
    # AND refuses a stable unless the trigger is a branch push of `main`.
    # The `paths` filter means an ordinary feature merge (no version bump)
    # never even runs this workflow a second time — `ci.yml` already tested it.
    branches:
      - main
      - next
    paths:
      - 'packages/surface-host/package.json'
      - 'packages/surface-client/package.json'
      - 'packages/account-client/package.json'
      - 'packages/surface-render/package.json'
      - 'packages/doc-schema/package.json'
      - 'packages/surface-server/package.json'
    tags:
      # App release tags
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      # App-client release tags
      - 'client-v[0-9]+.[0-9]+.[0-9]+'
      - 'client-v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      # Account-client release tags
      - 'account-v[0-9]+.[0-9]+.[0-9]+'
      - 'account-v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      # Surface-render release tags
      - 'render-v[0-9]+.[0-9]+.[0-9]+'
      - 'render-v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      # Doc-schema release tags
      - 'doc-schema-v[0-9]+.[0-9]+.[0-9]+'
      - 'doc-schema-v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      # Surface-server release tags
      - 'server-v[0-9]+.[0-9]+.[0-9]+'
      - 'server-v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      # Docs-editor release tags (GitHub release tarball, not npm)
      - 'docs-editor-v[0-9]+.[0-9]+.[0-9]+'
      - 'docs-editor-v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      # Meeting-ingest release tags (GitHub release tarball, not npm)
      - 'meeting-ingest-v[0-9]+.[0-9]+.[0-9]+'
      - 'meeting-ingest-v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      # Meeting-mcp release tags (GitHub release tarball, not npm)
      - 'meeting-mcp-v[0-9]+.[0-9]+.[0-9]+'
      - 'meeting-mcp-v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

concurrency:
  # Don't let two releases race on the same tag.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # What, if anything, needs publishing. Tag-push still honoured for rc's
  # (`--tag-push`); stables publish from `main` only (hub#913).
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      surface: ${{ steps.surface.outputs.should_publish }}
      surface_client: ${{ steps.surface_client.outputs.should_publish }}
      account_client: ${{ steps.account_client.outputs.should_publish }}
      surface_render: ${{ steps.surface_render.outputs.should_publish }}
      doc_schema: ${{ steps.doc_schema.outputs.should_publish }}
      surface_server: ${{ steps.surface_server.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The drift advisory asks git "what's on this tag that HEAD doesn't
          # contain?" — a `<tag>..HEAD` range. A bare checkout fetches
          # `--depth=1 --no-tags`, where that range exits 128 and the advisory
          # reports nothing, forever (hub#830).
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - id: surface
        run: bun scripts/release-plan.ts packages/surface-host @openparachute/surface ${{ github.ref_type == 'tag' && '--tag-push' || '' }}
      - id: surface_client
        run: bun scripts/release-plan.ts packages/surface-client @openparachute/surface-client ${{ github.ref_type == 'tag' && '--tag-push' || '' }}
      - id: account_client
        run: bun scripts/release-plan.ts packages/account-client @openparachute/account-client ${{ github.ref_type == 'tag' && '--tag-push' || '' }}
      - id: surface_render
        run: bun scripts/release-plan.ts packages/surface-render @openparachute/surface-render ${{ github.ref_type == 'tag' && '--tag-push' || '' }}
      - id: doc_schema
        run: bun scripts/release-plan.ts packages/doc-schema @openparachute/doc-schema ${{ github.ref_type == 'tag' && '--tag-push' || '' }}
      - id: surface_server
        run: bun scripts/release-plan.ts packages/surface-server @openparachute/surface-server ${{ github.ref_type == 'tag' && '--tag-push' || '' }}

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - name: install deps
        # Workspace root install — picks up every packages/* workspace and
        # web/admin (the bundled admin SPA).
        run: bun install --frozen-lockfile
      - name: typecheck
        # Root script typechecks all workspace packages (surface-host,
        # surface-client, surface-server, surface-render,
        # pebble-config, doc-schema incl. its no-DOM codec tsconfig).
        run: bun run typecheck:all
      - name: tests
        # Root script runs every suite: surface-host, surface-client,
        # surface-server, pebble-config, doc-schema (bun test), plus
        # surface-render (vitest via `bun run --filter`).
        run: bun run test

  publish-surface-npm:
    name: publish @openparachute/surface to npm
    needs: [plan, test]
    # Plan is consulted on tag pushes too — a tag is not a bypass of the
    # stable-from-main gate. The prefix clause still stops a client-/account-/…
    # tag from also publishing surface-host (all six plan steps run --tag-push).
    if: ${{ needs.plan.outputs.surface == 'true' && (github.ref_type != 'tag' || (!startsWith(github.ref_name, 'client-') && !startsWith(github.ref_name, 'account-') && !startsWith(github.ref_name, 'render-') && !startsWith(github.ref_name, 'doc-schema-') && !startsWith(github.ref_name, 'server-') && !startsWith(github.ref_name, 'docs-editor-') && !startsWith(github.ref_name, 'meeting-ingest-') && !startsWith(github.ref_name, 'meeting-mcp-'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance attestation + Trusted Publishing OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm 11.5+ which has Trusted Publishing OIDC
          # support built in. Node 20 LTS only has npm 10 and would
          # silently fall back to token auth (failing without NPM_TOKEN).
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: install deps
        # Workspace install at root brings in the admin SPA's deps too,
        # so the `build` step below can build dist/admin/.
        run: bun install --frozen-lockfile
      - name: verify package.json version matches tag
        # Tag path only — on a branch push the version comes FROM
        # package.json, so there is nothing to drift against.
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./packages/surface-host/package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::packages/surface-host/package.json version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
      - name: "guard against workspace:/link: protocol in published manifest"
        # npm publish does NOT rewrite `workspace:`/`link:` protocols (only bun/pnpm
        # do, on their own publish path). A leaked protocol breaks every `npm install`
        # of the published package. surface-host depends on @openparachute/surface-client
        # — fail loudly before publish if any dependency block still carries one.
        # (This job MISSING the guard is exactly what let surface@0.3.3 publish
        # uninstallable — see #152.)
        working-directory: packages/surface-host
        run: |
          if node -e "const p=require('./package.json'); let bad=[]; for (const k of ['dependencies','peerDependencies','optionalDependencies']) { const b=p[k]||{}; for (const [d,v] of Object.entries(b)) if (String(v).startsWith('workspace:')||String(v).startsWith('link:')) bad.push(k+'.'+d+'='+v); } if (bad.length) { console.error(bad.join('\n')); process.exit(1); }"; then
            echo "no workspace:/link: protocols in published manifest"
          else
            echo "::error::packages/surface-host/package.json has workspace:/link: protocol in a published dependency block — convert to concrete semver"
            exit 1
          fi
      - name: build surface-host (bundles admin SPA into dist/)
        # surface-host's `files` includes `dist/admin/**`, so the admin SPA
        # must be built before `npm publish` packs the tarball. The
        # package.json has no prepack/prepublishOnly hook, so we run
        # the build explicitly here.
        working-directory: packages/surface-host
        run: bun run build
      - name: publish
        # Trusted Publishing: npm verifies the OIDC token from this workflow
        # against the package's configured trusted publisher rule
        # (org=ParachuteComputer, repo=parachute-surface, workflow=release.yml).
        # No NPM_TOKEN secret needed; `id-token: write` permission above
        # makes the OIDC token available to npm CLI.
        working-directory: packages/surface-host
        run: |
          # Dist-tag from the VERSION BEING PUBLISHED, not from the ref.
          # On a merge-triggered run GITHUB_REF_NAME is `next`/`main` —
          # matching no rc pattern, so every publish-on-merge would land on
          # `latest` (hub#792).
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          case "$PKG_VERSION" in
            *-rc.*) DIST_TAG=rc ;;
            *)      DIST_TAG=latest ;;
          esac
          echo "publishing @openparachute/surface with dist-tag=$DIST_TAG"
          npm publish --tag "$DIST_TAG" --access public --provenance

  publish-surface-client-npm:
    name: publish @openparachute/surface-client to npm
    needs: [plan, test]
    # surface-client-only: skip on surface (`v*`) tags. Plan is consulted on
    # tag pushes too — a tag is not a bypass of the stable-from-main gate.
    if: ${{ needs.plan.outputs.surface_client == 'true' && (github.ref_type != 'tag' || startsWith(github.ref_name, 'client-')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: install deps
        # Workspace install at root.
        run: bun install --frozen-lockfile
      - name: verify package.json version matches tag
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./packages/surface-client/package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#client-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::packages/surface-client/package.json version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
      - name: "guard against workspace:/link: protocol in published manifest"
        # npm publish does NOT rewrite `workspace:`/`link:` protocols (only bun/pnpm
        # do, on their own publish path). A leaked protocol breaks every `npm install`
        # of the published package. Fail loudly before publish if any dependency
        # block still carries one.
        working-directory: packages/surface-client
        run: |
          if node -e "const p=require('./package.json'); let bad=[]; for (const k of ['dependencies','peerDependencies','optionalDependencies']) { const b=p[k]||{}; for (const [d,v] of Object.entries(b)) if (String(v).startsWith('workspace:')||String(v).startsWith('link:')) bad.push(k+'.'+d+'='+v); } if (bad.length) { console.error(bad.join('\n')); process.exit(1); }"; then
            echo "no workspace:/link: protocols in published manifest"
          else
            echo "::error::packages/surface-client/package.json has workspace:/link: protocol in a published dependency block — convert to concrete semver"
            exit 1
          fi
      - name: publish
        # surface-client's package.json has `prepublishOnly: bun run build`, so
        # `npm publish` will build (tsc) before packing. No explicit build
        # step needed here.
        working-directory: packages/surface-client
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          case "$PKG_VERSION" in
            *-rc.*) DIST_TAG=rc ;;
            *)      DIST_TAG=latest ;;
          esac
          echo "publishing @openparachute/surface-client with dist-tag=$DIST_TAG"
          npm publish --tag "$DIST_TAG" --access public --provenance

  publish-account-client-npm:
    name: publish @openparachute/account-client to npm
    needs: [plan, test]
    if: ${{ needs.plan.outputs.account_client == 'true' && (github.ref_type != 'tag' || startsWith(github.ref_name, 'account-')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: install deps
        # Workspace install at root.
        run: bun install --frozen-lockfile
      - name: verify package.json version matches tag
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./packages/account-client/package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#account-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::packages/account-client/package.json version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
      - name: "guard against workspace:/link: protocol in published manifest"
        # npm publish does NOT rewrite `workspace:`/`link:` protocols (only bun/pnpm
        # do, on their own publish path). A leaked protocol breaks every `npm install`
        # of the published package. account-client is deliberately dependency-free, so
        # this guard should always pass — but keep it in lock-step with the sibling
        # jobs so a future dependency can't slip a protocol through.
        working-directory: packages/account-client
        run: |
          if node -e "const p=require('./package.json'); let bad=[]; for (const k of ['dependencies','peerDependencies','optionalDependencies']) { const b=p[k]||{}; for (const [d,v] of Object.entries(b)) if (String(v).startsWith('workspace:')||String(v).startsWith('link:')) bad.push(k+'.'+d+'='+v); } if (bad.length) { console.error(bad.join('\n')); process.exit(1); }"; then
            echo "no workspace:/link: protocols in published manifest"
          else
            echo "::error::packages/account-client/package.json has workspace:/link: protocol in a published dependency block — convert to concrete semver"
            exit 1
          fi
      - name: publish
        # account-client's package.json has `prepublishOnly: bun run build`, so
        # `npm publish` will build (tsc) before packing. No explicit build
        # step needed here.
        working-directory: packages/account-client
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          case "$PKG_VERSION" in
            *-rc.*) DIST_TAG=rc ;;
            *)      DIST_TAG=latest ;;
          esac
          echo "publishing @openparachute/account-client with dist-tag=$DIST_TAG"
          npm publish --tag "$DIST_TAG" --access public --provenance

  publish-surface-render-npm:
    name: publish @openparachute/surface-render to npm
    needs: [plan, test]
    if: ${{ needs.plan.outputs.surface_render == 'true' && (github.ref_type != 'tag' || startsWith(github.ref_name, 'render-')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: install deps
        # Workspace install at root.
        run: bun install --frozen-lockfile
      - name: verify package.json version matches tag
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./packages/surface-render/package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#render-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::packages/surface-render/package.json version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
      - name: "guard against workspace:/link: protocol in published manifest"
        # npm publish does NOT rewrite `workspace:`/`link:` protocols (only bun/pnpm
        # do, on their own publish path). A leaked protocol breaks every `npm install`
        # of the published package. surface-render depends on surface-client — fail
        # loudly before publish if that dep (or any other) still carries a protocol.
        working-directory: packages/surface-render
        run: |
          if node -e "const p=require('./package.json'); let bad=[]; for (const k of ['dependencies','peerDependencies','optionalDependencies']) { const b=p[k]||{}; for (const [d,v] of Object.entries(b)) if (String(v).startsWith('workspace:')||String(v).startsWith('link:')) bad.push(k+'.'+d+'='+v); } if (bad.length) { console.error(bad.join('\n')); process.exit(1); }"; then
            echo "no workspace:/link: protocols in published manifest"
          else
            echo "::error::packages/surface-render/package.json has workspace:/link: protocol in a published dependency block — convert to concrete semver"
            exit 1
          fi
      - name: publish
        # surface-render's package.json has `prepublishOnly: bun run build`, so
        # `npm publish` will build (tsc) before packing. No explicit build
        # step needed here.
        working-directory: packages/surface-render
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          case "$PKG_VERSION" in
            *-rc.*) DIST_TAG=rc ;;
            *)      DIST_TAG=latest ;;
          esac
          echo "publishing @openparachute/surface-render with dist-tag=$DIST_TAG"
          npm publish --tag "$DIST_TAG" --access public --provenance

  publish-doc-schema-npm:
    name: publish @openparachute/doc-schema to npm
    needs: [plan, test]
    if: ${{ needs.plan.outputs.doc_schema == 'true' && (github.ref_type != 'tag' || startsWith(github.ref_name, 'doc-schema-')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: install deps
        # Workspace install at root.
        run: bun install --frozen-lockfile
      - name: verify package.json version matches tag
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./packages/doc-schema/package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#doc-schema-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::packages/doc-schema/package.json version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
      - name: "guard against workspace:/link: protocol in published manifest"
        # npm publish does NOT rewrite `workspace:`/`link:` protocols (only bun/pnpm
        # do, on their own publish path). A leaked protocol breaks every `npm install`
        # of the published package. Fail loudly before publish if any dependency
        # block still carries one (same guard as the sibling publish jobs).
        working-directory: packages/doc-schema
        run: |
          if node -e "const p=require('./package.json'); let bad=[]; for (const k of ['dependencies','peerDependencies','optionalDependencies']) { const b=p[k]||{}; for (const [d,v] of Object.entries(b)) if (String(v).startsWith('workspace:')||String(v).startsWith('link:')) bad.push(k+'.'+d+'='+v); } if (bad.length) { console.error(bad.join('\n')); process.exit(1); }"; then
            echo "no workspace:/link: protocols in published manifest"
          else
            echo "::error::packages/doc-schema/package.json has workspace:/link: protocol in a published dependency block — convert to concrete semver"
            exit 1
          fi
      - name: publish
        # doc-schema's package.json has `prepublishOnly: bun run build` (tsc →
        # dist/, the published artifact), so `npm publish` builds just-in-time.
        working-directory: packages/doc-schema
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          case "$PKG_VERSION" in
            *-rc.*) DIST_TAG=rc ;;
            *)      DIST_TAG=latest ;;
          esac
          echo "publishing @openparachute/doc-schema with dist-tag=$DIST_TAG"
          npm publish --tag "$DIST_TAG" --access public --provenance

  publish-surface-server-npm:
    name: publish @openparachute/surface-server to npm
    needs: [plan, test]
    if: ${{ needs.plan.outputs.surface_server == 'true' && (github.ref_type != 'tag' || startsWith(github.ref_name, 'server-')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: install deps
        # Workspace install at root.
        run: bun install --frozen-lockfile
      - name: verify package.json version matches tag
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./packages/surface-server/package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#server-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::packages/surface-server/package.json version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
      - name: "guard against workspace:/link: protocol in published manifest"
        # npm publish does NOT rewrite `workspace:`/`link:` protocols (only bun/pnpm
        # do, on their own publish path). A leaked protocol breaks every `npm install`
        # of the published package. surface-server depends on @openparachute/surface
        # and @openparachute/surface-client — fail loudly before publish if any dep
        # still carries a protocol.
        working-directory: packages/surface-server
        run: |
          if node -e "const p=require('./package.json'); let bad=[]; for (const k of ['dependencies','peerDependencies','optionalDependencies']) { const b=p[k]||{}; for (const [d,v] of Object.entries(b)) if (String(v).startsWith('workspace:')||String(v).startsWith('link:')) bad.push(k+'.'+d+'='+v); } if (bad.length) { console.error(bad.join('\n')); process.exit(1); }"; then
            echo "no workspace:/link: protocols in published manifest"
          else
            echo "::error::packages/surface-server/package.json has workspace:/link: protocol in a published dependency block — convert to concrete semver"
            exit 1
          fi
      - name: publish
        # surface-server publishes raw TypeScript sources (`files: src/**/*.ts`,
        # exports point at src/) — no build step, nothing to compile before pack.
        working-directory: packages/surface-server
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          case "$PKG_VERSION" in
            *-rc.*) DIST_TAG=rc ;;
            *)      DIST_TAG=latest ;;
          esac
          echo "publishing @openparachute/surface-server with dist-tag=$DIST_TAG"
          npm publish --tag "$DIST_TAG" --access public --provenance

  # Record what shipped as git tags.
  #
  # A RECORD, not a trigger — nothing fires off these, which is exactly why
  # GITHUB_TOKEN pushing them is fine (a token-pushed tag can't start a
  # workflow, and here it doesn't need to). `always()` with per-package result
  # checks so one package's publish failure doesn't suppress the others' tags.
  tag-record:
    name: tag what shipped
    needs: [plan, publish-surface-npm, publish-surface-client-npm, publish-account-client-npm, publish-surface-render-npm, publish-doc-schema-npm, publish-surface-server-npm]
    if: ${{ always() && github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - name: tag published packages
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag_if() {  # <prefix> <dir> <published?>
            [ "$3" = "success" ] || return 0
            V=$(bun -e "console.log(require('./$2/package.json').version)")
            T="$1$V"
            if git rev-parse "$T" >/dev/null 2>&1; then
              echo "$T already exists"
            else
              git tag "$T" && git push origin "$T" && echo "tagged $T"
            fi
          }
          tag_if "v"            "packages/surface-host"    "${{ needs.publish-surface-npm.result }}"
          tag_if "client-v"     "packages/surface-client"  "${{ needs.publish-surface-client-npm.result }}"
          tag_if "account-v"    "packages/account-client"  "${{ needs.publish-account-client-npm.result }}"
          tag_if "render-v"     "packages/surface-render"  "${{ needs.publish-surface-render-npm.result }}"
          tag_if "doc-schema-v" "packages/doc-schema"      "${{ needs.publish-doc-schema-npm.result }}"
          tag_if "server-v"     "packages/surface-server"  "${{ needs.publish-surface-server-npm.result }}"

  release-docs-editor-tarball:
    name: attach docs-editor installable tarball to a GitHub Release
    needs: test
    # docs-editor-only: gate on the `docs-editor-v...` tag prefix.
    #
    # docs-editor is private:true (never npm) — its DISTRIBUTION is this
    # release asset. The tarball layout matches what surface-host's
    # URL-source install flow expects (url-fetch.ts locatePackageRoot +
    # admin-routes copyServerFiles): a single `package/` root holding
    # meta.json, dist/ (the web SPA), and server/index.bundle.js (the
    # SELF-CONTAINED server bundle — installs copy dist/ + the entry's
    # first path segment + meta.json, never node_modules). Layout proven
    # by WovenBoulder's release-surface.yml (the reference packaging flow
    # for backed surfaces); this variant creates the GitHub Release for
    # the pushed tag itself when none exists, then attaches the asset.
    if: ${{ startsWith(github.ref_name, 'docs-editor-') }}
    runs-on: ubuntu-latest
    permissions:
      # gh release create + upload.
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - name: install deps
        # Workspace install at root — docs-editor's deps resolve to the
        # workspace copies (the monorepo precedent for private packages).
        run: bun install --frozen-lockfile
      - name: verify package.json version matches tag
        # Same tag-drift defense as the npm jobs; tag prefix is
        # `docs-editor-v...`. meta.json's version is REWRITTEN from the tag
        # at assemble time below, so package.json is the single thing to pin.
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./packages/docs-editor/package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#docs-editor-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::packages/docs-editor/package.json version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
      - name: build (web dist + self-contained server bundle)
        # `bun run build` = `vite build && bun run build:server` — emits
        # dist/ (the SPA) and server/index.bundle.js (the artifact
        # meta.json's server.entry names; both are gitignored).
        working-directory: packages/docs-editor
        run: bun run build
      - name: assemble package
        # Exactly the installer's layout — meta.json + dist/ + the bundled
        # entry, nothing else (no TS sources, no __tests__, no node_modules).
        # meta.json's server.entry already names server/index.bundle.js (the
        # repo meta points at the build artifact, unlike the WovenBoulder
        # template's dev-entry rewrite) — only `version` is stamped from the
        # tag. The jq filter PRESERVES server.capabilities (["websocket"]).
        working-directory: packages/docs-editor
        run: |
          rm -rf .pack  # idempotent: a stale .pack would ship stale files on re-run
          mkdir -p .pack/package/server
          cp -R dist .pack/package/dist
          cp server/index.bundle.js .pack/package/server/index.bundle.js
          VERSION="${GITHUB_REF_NAME#docs-editor-v}"
          jq --arg v "$VERSION" '.version = $v' meta.json > .pack/package/meta.json
      - name: pack tarball
        id: pack
        working-directory: packages/docs-editor
        run: |
          VERSION="${GITHUB_REF_NAME#docs-editor-v}"
          TARBALL="docs-editor-surface-${VERSION}.tgz"
          tar -czf "$TARBALL" -C .pack package
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - name: validate tarball layout (the installer's expectations)
        # Two layers: the tar listing carries every path the install flow
        # requires, and the bundled entry actually loads as a standalone
        # module exporting the P1 default-export factory (the same
        # self-containment pin as the package's install-simulation test).
        working-directory: packages/docs-editor
        run: |
          LISTING="$(tar -tzf "${{ steps.pack.outputs.tarball }}")"
          for required in package/meta.json package/dist/index.html package/server/index.bundle.js; do
            echo "$LISTING" | grep -qx "$required" || { echo "::error::tarball is missing $required"; exit 1; }
          done
          # meta.json must name the entry the tarball actually carries.
          ENTRY=$(jq -r '.server.entry' .pack/package/meta.json)
          if [ "$ENTRY" != "server/index.bundle.js" ]; then
            echo "::error::meta.json server.entry is $ENTRY, expected server/index.bundle.js"
            exit 1
          fi
          bun -e 'const m = await import(process.cwd() + "/.pack/package/server/index.bundle.js");
                  if (typeof m.default !== "function") { console.error("no default-export factory"); process.exit(1); }
                  console.log("server entry OK: default-export factory present");'
          echo "tarball layout OK"
      - name: create the GitHub Release if none exists, attach the tarball
        # Tag-triggered (no `release: published` event in this repo), so the
        # Release object may not exist yet — create it for the pushed tag,
        # marked prerelease on rc tags. --clobber makes re-runs idempotent.
        working-directory: packages/docs-editor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            PRERELEASE_FLAG=""
            if [[ "$GITHUB_REF_NAME" =~ -rc\. ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag $PRERELEASE_FLAG \
              --title "docs-editor ${GITHUB_REF_NAME#docs-editor-v}" \
              --notes "Installable tarball for the Docs surface (collaborative markdown editor). Install via Surface admin → Add surface → paste: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME — requires hub ≥ 0.7.1 (the \`surface\` audience tier). See packages/docs-editor/README.md."
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "${{ steps.pack.outputs.tarball }}" --clobber

